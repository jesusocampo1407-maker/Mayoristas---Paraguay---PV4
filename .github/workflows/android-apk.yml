# Mayoristas Paraguay · APK de depuración V10.3 (Capacitor 6)
# Este workflow vive en android-apk y construye SOLO desde android-apk.
# No descarga ni modifica main, GitHub Pages o Firebase.
name: Build Android APK (debug, V10.3)

on:
  push:
    branches: [android-apk]

permissions:
  contents: write

env:
  EXPECTED_VERSION_REGEX: '10[._-]3'

jobs:
  apk:
    if: github.ref == 'refs/heads/android-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar la rama de pruebas android-apk
        uses: actions/checkout@v4
        with:
          path: branch-src

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Comprobar la versión de la rama de pruebas
        run: |
          set -euo pipefail
          test -s branch-src/index.html || { echo "::error::android-apk no contiene index.html"; exit 1; }
          VER=$(grep -o 'MP_VERSION *= *"[^"]*"' branch-src/index.html | head -1 | sed 's/^[^"]*"//; s/"$//' || true)
          SHA=$(sha256sum branch-src/index.html | cut -d' ' -f1)
          echo "Commit de android-apk: $GITHUB_SHA"
          echo "MP_VERSION: ${VER:-<no encontrada>}"
          echo "SHA-256 index: $SHA"
          echo "Tamaño: $(wc -c < branch-src/index.html) bytes"
          [ -n "$VER" ] || { echo "::error::No se encontró window.MP_VERSION"; exit 1; }
          echo "$VER" | grep -Eq "$EXPECTED_VERSION_REGEX" || { echo "::error::La versión '$VER' no coincide con V10.3"; exit 1; }
          { echo "SOURCE_COMMIT=$GITHUB_SHA"; echo "MP_VERSION=$VER"; echo "INDEX_SHA256=$SHA"; } >> "$GITHUB_ENV"

      - name: Preparar la web desde android-apk (sin modificar el repositorio)
        run: |
          set -euo pipefail
          mkdir -p apk-build/www
          tar -C branch-src --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='tests' \
              --exclude='*.py' --exclude='*.mjs' --exclude='*.rules' --exclude='*.md' -cf - . | tar -C apk-build/www -xf -
          test -s apk-build/www/index.html
          # Los enlaces de compartir conservan la URL pública; solo se modifica la copia de la APK.
          python3 - <<'PY'
          import re
          p = "apk-build/www/index.html"
          s = open(p, encoding="utf-8").read()
          pat = re.compile(r'function siteUrl\(\)\{[^{}]*\}')
          matches = pat.findall(s)
          url = "https://jesusocampo1407-maker.github.io/Mayoristas---Paraguay---PV4/"
          if len(matches) == 1:
              s = pat.sub(lambda _: 'function siteUrl(){return "%s"}' % url, s, count=1)
              open(p, "w", encoding="utf-8").write(s)
              print("siteUrl() preparada para la web pública")
          else:
              print("::warning::siteUrl() aparece %d veces; no se modificó" % len(matches))
          PY
          rc=0; diff branch-src/index.html apk-build/www/index.html > /tmp/index.diff || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::No pude comparar el index preparado"; exit 1; }
          CHANGED=$(grep -c '^<' /tmp/index.diff || true)
          echo "Líneas diferentes respecto de android-apk: $CHANGED (máximo esperado: 1 por siteUrl)"
          [ "$CHANGED" -le 1 ] || { echo "::error::La copia difiere de la rama en más de una línea"; exit 1; }

      - name: Crear el proyecto Capacitor (com.mayoristasparaguay.app)
        working-directory: apk-build
        run: |
          set -euo pipefail
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mayoristasparaguay.app",
            "appName": "Mayoristas Paraguay",
            "webDir": "www",
            "backgroundColor": "#0b0b0c",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Compilar la APK de depuración
        working-directory: apk-build/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar el contenido y la versión de la APK
        run: |
          set -euo pipefail
          APK=apk-build/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::No se generó la APK"; exit 1; }
          cp "$APK" MayoristasParaguay-debug.apk
          unzip -p MayoristasParaguay-debug.apk assets/public/index.html > /tmp/apk-index.html
          test -s /tmp/apk-index.html || { echo "::error::La APK no contiene assets/public/index.html"; exit 1; }
          cmp -s /tmp/apk-index.html apk-build/www/index.html || { echo "::error::El index dentro de la APK no coincide con la copia preparada"; exit 1; }
          APKVER=$(grep -o 'MP_VERSION *= *"[^"]*"' /tmp/apk-index.html | head -1 | sed 's/^[^"]*"//; s/"$//' || true)
          echo "MP_VERSION dentro de la APK: $APKVER"
          [ "$APKVER" = "$MP_VERSION" ] || { echo "::error::La versión de la APK no coincide con android-apk"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -n "$AAPT" ]; then
            PKG=$("$AAPT" dump packagename MayoristasParaguay-debug.apk)
            echo "Identificador de la APK: $PKG"
            [ "$PKG" = "com.mayoristasparaguay.app" ] || { echo "::error::Identificador incorrecto: $PKG"; exit 1; }
          else
            echo "::warning::No encontré aapt2; no se pudo verificar el identificador del paquete"
          fi
          ls -l MayoristasParaguay-debug.apk
          {
            echo "APK V10.3 de Mayoristas Paraguay (com.mayoristasparaguay.app), para instalar y probar."
            echo
            echo "- Versión empaquetada: $MP_VERSION"
            echo "- Rama fuente: android-apk"
            echo "- Commit fuente: $SOURCE_COMMIT"
            echo "- SHA-256 del index.html: $INDEX_SHA256"
          } > release-notes.md
          cp release-notes.md "$GITHUB_STEP_SUMMARY"

      - name: Guardar la APK como archivo de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: MayoristasParaguay-debug-apk
          path: MayoristasParaguay-debug.apk
          retention-days: 30

      - name: Publicar la APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug-v10.3-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: APK de depuración V10.3 #${{ github.run_number }}
          body_path: release-notes.md
          prerelease: true
          files: MayoristasParaguay-debug.apk
